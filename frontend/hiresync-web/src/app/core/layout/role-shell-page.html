<div class="workspace-shell">
  <button
    type="button"
    class="mobile-overlay"
    [class.visible]="menuOpen()"
    aria-label="Close navigation"
    (click)="closeMenu()"
  ></button>

  <aside
    class="sidebar"
    [class.open]="menuOpen()"
  >
    <div class="brand">
      <div
        class="brand-mark"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M7 5v14M17 5v14M7 12h10"
          />
        </svg>
      </div>

      <div class="brand-copy">
        <strong>
          HireSync
        </strong>

        <span>
          Smart Recruitment
        </span>
      </div>
    </div>

    <div class="workspace-label">
      <span>
        Workspace
      </span>

      <strong>
        {{ roleLabel() }}
      </strong>
    </div>

    <nav
      class="sidebar-nav"
      aria-label="Workspace navigation"
    >
      @for (
        item of navigation();
        track item.route
      ) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          <span
            class="nav-icon"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                [attr.d]="item.iconPath"
              />
            </svg>
          </span>

          <span class="nav-label">
            {{ item.label }}
          </span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="account-summary">
        <div
          class="avatar"
          aria-hidden="true"
        >
          {{ avatarLabel() }}
        </div>

        <div>
          <strong>
            {{ roleLabel() }}
          </strong>

          <span>
            {{ email() }}
          </span>
        </div>
      </div>

      <button
        type="button"
        class="logout-button"
        (click)="logout()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"
          />
        </svg>

        <span>
          Logout
        </span>
      </button>
    </div>
  </aside>

  <section class="workspace-main">
    <header class="mobile-header">
      <button
        type="button"
        class="menu-button"
        aria-label="Open navigation"
        (click)="toggleMenu()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M4 7h16M4 12h16M4 17h16"
          />
        </svg>
      </button>

      <div class="mobile-brand">
        <strong>
          HireSync
        </strong>

        <span>
          {{ roleLabel() }} workspace
        </span>
      </div>
    </header>

    <main class="workspace-content">
      <router-outlet />
    </main>
  </section>
</div>
