<main class="match-page">
  <section
    class="match-hero"
    aria-labelledby="vacancy-detail-heading"
  >
    <div class="match-hero__copy">
      <p class="match-hero__eyebrow">
        Job Seeker workspace
      </p>

      <h1 id="vacancy-detail-heading">
        Vacancy &amp; match details
      </h1>

      <p>
        Review the role, your authoritative HireSync match
        result and application readiness.
      </p>

      <a
        class="back-link"
        routerLink="/seeker/vacancies"
        queryParamsHandling="preserve"
      >
        <span aria-hidden="true">
          &larr;
        </span>
        Back to Find Jobs
      </a>
    </div>
  </section>

  <app-job-match-result
    [vacancyId]="vacancyId()"
  />
</main>
